<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="stylesheet" href="style.css">
  <title>Sää eri kaupungeissa</title>
</head>

<body>

  <div class="container">
    <h1>Sääsovellus</h1>

    <input type="text" id="kaupunki" placeholder="Hae kaupunkia" />

    <br>

    <button onclick="haesaa()">Hae sää</button>

    <div class="saa" id="saatila"></div>
  </div>

  <script>
    async function haesaa() {
      const city = document.getElementById("kaupunki").value;

      const apiKey = "1810fb461a0f224e8cd5a7c5d715a8b0";
      
      const url =
        `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=fi`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        document.getElementById("saatila").innerHTML = `
          <h2>${data.name}</h2>

          <div class="temp">
            ${Math.round(data.main.temp)}°C
          </div>

          <div class="info">
            <p>Sää: ${data.weather[0].description}</p>
            <p>Tuuli: ${data.wind.speed} m/s</p>
          </div>
        `;
      }

      catch (error) {
  document.getElementById("saatila").innerHTML =
    "<p>Tapahtui virhe.</p>";
}

    }
  </script>

</body>
</html>
