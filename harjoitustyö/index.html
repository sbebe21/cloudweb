<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sää Helsingissä</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #FAF2FC;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      padding: 20px 30px;
      border-radius: 12px;
      text-align: center;
    }
    h1 { margin-bottom: 10px; }
    .temp {
      font-size: 40px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Helsingin sää</h1>
    <div id="weather">Ladataan...</div>
  </div>

<script>
    async function haesaa() {
      try {
        const osoite = "https://api.open-meteo.com/v1/forecast?latitude=60.1699&longitude=24.9384&current_weather=true";
        const vastaus = await fetch(osoite);
        const data = await vastaus.json();
        const nykyinenSaa = data.current_weather;
        document.getElementById("weather").innerHTML = `
          <div class="temp">${nykyinenSaa.temperature}°C</div>
        `;
      } catch (virhe) {
        // Jos jotain menee pieleen
        document.getElementById("weather").textContent = "Virhe haettaessa säätä";
        console.error(virhe);
      }
    }
    haesaa();
  </script>
</body>
</html>
