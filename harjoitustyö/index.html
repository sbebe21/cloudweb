<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sää Helsingissä</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #FAF2FC;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      padding: 20px 30px;
      border-radius: 12px;
      text-align: center;
    }
    h1 { margin-bottom: 10px; }
    .temp {
      font-size: 40px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Helsingin sää</h1>
    <div id="weather">Ladataan...</div>
  </div>

  <script>
    async function haesaa() {
      const apiUrl = "https://api.open-meteo.com/v1/forecast?latitude=60.1699&longitude=24.9384&current_weather=true";

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        const currentWeather = data.current_weather;
        const temperature = currentWeather.temperature;

        document.getElementById("weather").innerHTML = `
          <div class="temp">${temperature}°C</div>
        `;

      } catch (error) {
        document.getElementById("weather").textContent = "Virhe haettaessa säätä";
        console.error("Error fetching weather data:", error);
      }
    }

    haesaa();
  </script>
</body>
</html>
