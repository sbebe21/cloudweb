<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Sää eri kaupungeissa</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e0a1ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      width: 350px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 20px;
      color: #2d3436;
    }

    input {
      width: 90%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #0984e3;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0767b1;
    }

    .weather {
      margin-top: 20px;
    }

    .temp {
      font-size: 40px;
      font-weight: bold;
    }

    .info {
      margin-top: 10px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Sääsovellus</h1>

    <input type="text" id="cityInput" placeholder="Hae kaupunkia" />

    <br>

    <button onclick="getWeather()">Hae sää</button>

    <div class="weather" id="weatherResult"></div>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById("cityInput").value;

      const apiKey = "1810fb461a0f224e8cd5a7c5d715a8b0";
      
      const url =
        `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=fi`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.cod === "404") {
          document.getElementById("weatherResult").innerHTML =
            "<p>Kaupunkia ei löytynyt.</p>";
          return;
        }

        document.getElementById("weatherResult").innerHTML = `
          <h2>${data.name}</h2>

          <div class="temp">
            ${Math.round(data.main.temp)}°C
          </div>

          <div class="info">
            <p>Sää: ${data.weather[0].description}</p>
            <p>Tuuli: ${data.wind.speed} m/s</p>
            <p>Kosteus: ${data.main.humidity}%</p>
          </div>
        `;
      }

      catch (error) {
        document.getElementById("weatherResult").innerHTML =
          "<p>Jotain meni nyt vikaan.</p>";
      }
    }
  </script>

</body>
</html>
